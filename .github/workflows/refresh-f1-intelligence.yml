name: Refresh F1 intelligence feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/refresh-f1-intelligence.py
      - name: Commit refreshed feeds
        run: |
          git config user.name "f1-pulse-bot"
          git config user.email "actions@github.com"
          git add public/data/fia-news.json public/data/technical-updates.json
          git diff --cached --quiet || (git commit -m "chore: refresh F1 intelligence feeds" && git push)
